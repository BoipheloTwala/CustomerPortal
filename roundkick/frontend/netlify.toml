[build]
  # Build command
  command = "npm run build"

  # Directory to publish (build output directory)
  publish = "dist"

[build.environment]
  # Ensure devDependencies (like Vite) are installed during build
  NPM_FLAGS = "--include=dev"
  # Use a Node version compatible with newer Vite if needed
  NODE_VERSION = "20.19.0"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS for MITM protection
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Cloudflare-specific headers
    CF-IPCountry = "{country}"
    CF-Ray = "{ray}"
    CF-Visitor = "{\"scheme\":\"https\"}"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/Profilepicture.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
